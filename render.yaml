services:
  - type: web
    name: rachit-accounting-workbench
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_DEMO
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: WORKBENCH_DB
        value: /app/data/workbench.sqlite3
